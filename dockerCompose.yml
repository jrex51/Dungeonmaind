services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
      target: development
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_DOCKER_MODE=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./backend:/app
      # Runtime downloads persist here; models are not baked into the image.
      - backend_models:/models
      - backend_huggingface:/root/.cache/huggingface
    env_file:
      - ./backend/.env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  ollama:
    build:
      context: ./LLM
      dockerfile: dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama_volume:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ollama-ready && ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      # Allow the initial model downloads to finish before declaring failure.
      start_period: 60m
      retries: 6
    stop_grace_period: 30s

volumes:
  backend_models:
  backend_huggingface:
  ollama_volume:
  chroma_volume:
